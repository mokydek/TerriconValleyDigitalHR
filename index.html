<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, shrink-to-fit=no" />
    <!-- конфигурация до любых стилей: внешние стили не должны задерживать запуск -->
    <script src="/config.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#168F12" />
    <meta name="description" content="JanaMen: единая цифровая HR-платформа Jana Post. Профиль, заявки, обучение и AI-помощник в одном окне." />
    <title>JanaMen · HR-платформа Jana Post</title>
    <style>
      body { margin: 0; background: #f4f7f4; }
      #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center; color: #17221a; font: 15px/1.45 -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; }
      #boot .spin { width: 28px; height: 28px; border: 3px solid #d6efd5; border-top-color: #168f12; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      #boot b { display: block; font-size: 17px; }
      #boot small { display: block; max-width: 340px; margin-top: 6px; color: #6b776e; word-break: break-word; }
      #boot button { display: none; margin-top: 4px; padding: 10px 22px; border: 0; border-radius: 12px; background: #168f12; color: #fff; font: inherit; font-weight: 600; }
      #boot.stuck .spin { display: none; }
      #boot.stuck button, #boot.slow button { display: inline-block; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Пока приложение не запустилось, на экране заглушка #boot. Если файлы сборки не загрузились
      // (старая копия страницы после обновления сайта) — один раз перезагружаемся; при ошибке или
      // долгой загрузке показываем понятное сообщение и кнопку вместо пустой страницы.
      ;(function () {
        var KEY = 'janamen-boot-reload'
        // тексты заглушки на языке, выбранном в прошлый раз (сам словарь приложения ещё не загружен)
        var TEXTS = {
          ru: ['Загрузка JanaMen…', 'Не удалось загрузить JanaMen', 'Обновите страницу. Файл: ', 'Не удалось запустить JanaMen', 'Обновите страницу или откройте ссылку в другом браузере. ', 'Обновите страницу. ', 'Произошла ошибка', 'Загрузка идёт дольше обычного', 'Проверьте интернет. Если ничего не меняется, обновите страницу.', 'Обновить страницу'],
          kk: ['JanaMen жүктелуде…', 'JanaMen жүктелмеді', 'Бетті жаңартыңыз. Файл: ', 'JanaMen іске қосылмады', 'Бетті жаңартыңыз немесе сілтемені басқа браузерде ашыңыз. ', 'Бетті жаңартыңыз. ', 'Қате орын алды', 'Жүктеу әдеттегіден ұзағырақ созылып жатыр', 'Интернетті тексеріңіз. Ештеңе өзгермесе, бетті жаңартыңыз.', 'Бетті жаңарту'],
          en: ['Loading JanaMen…', 'JanaMen failed to load', 'Refresh the page. File: ', 'JanaMen failed to start', 'Refresh the page or open the link in another browser. ', 'Refresh the page. ', 'Something went wrong', 'Loading is taking longer than usual', 'Check your internet connection. If nothing changes, refresh the page.', 'Refresh page'],
          ky: ['JanaMen жүктөлүүдө…', 'JanaMen жүктөлгөн жок', 'Баракты жаңыртыңыз. Файл: ', 'JanaMen иштеген жок', 'Баракты жаңыртыңыз же шилтемени башка браузерде ачыңыз. ', 'Баракты жаңыртыңыз. ', 'Ката кетти', 'Жүктөө адаттагыдан узакка созулууда', 'Интернетти текшериңиз. Эч нерсе өзгөрбөсө, баракты жаңыртыңыз.', 'Баракты жаңыртуу'],
          uz: ['JanaMen yuklanmoqda…', 'JanaMen yuklanmadi', 'Sahifani yangilang. Fayl: ', 'JanaMen ishga tushmadi', 'Sahifani yangilang yoki havolani boshqa brauzerda oching. ', 'Sahifani yangilang. ', 'Xatolik yuz berdi', 'Yuklash odatdagidan uzoqroq davom etmoqda', 'Internetni tekshiring. Hech narsa oʻzgarmasa, sahifani yangilang.', 'Sahifani yangilash'],
          tg: ['JanaMen бор шуда истодааст…', 'JanaMen бор нашуд', 'Саҳифаро нав кунед. Файл: ', 'JanaMen оғоз нашуд', 'Саҳифаро нав кунед ё истинодро дар браузери дигар кушоед. ', 'Саҳифаро нав кунед. ', 'Хатогӣ рух дод', 'Боркунӣ аз маъмулӣ дарозтар идома дорад', 'Интернетро санҷед. Агар ҳеҷ чиз тағйир наёбад, саҳифаро нав кунед.', 'Саҳифаро нав кардан'],
          mn: ['JanaMen ачаалж байна…', 'JanaMen ачаалагдсангүй', 'Хуудсаа шинэчилнэ үү. Файл: ', 'JanaMen эхэлсэнгүй', 'Хуудсаа шинэчлэх эсвэл холбоосыг өөр хөтчөөр нээнэ үү. ', 'Хуудсаа шинэчилнэ үү. ', 'Алдаа гарлаа', 'Ачаалал ердийнхөөс удаж байна', 'Интернэтээ шалгана уу. Юу ч өөрчлөгдөхгүй бол хуудсаа шинэчилнэ үү.', 'Хуудсаа шинэчлэх'],
        }
        var LANG = 'ru'
        try {
          LANG = TEXTS[localStorage.getItem('janamen-lang')] ? localStorage.getItem('janamen-lang') : 'ru'
        } catch (e) {}
        var T = TEXTS[LANG]
        document.documentElement.lang = LANG
        // метка обхода кэша CDN (см. reloadFresh) — убираем из адреса до запуска приложения
        if (/[?&]_r=/.test(location.search) && window.history && history.replaceState) {
          var query = location.search.replace(/([?&])_r=[^&]*&?/, '$1').replace(/[?&]$/, '')
          history.replaceState(history.state, '', location.pathname + query + location.hash)
        }
        // CDN хостинга до 5 минут после обновления может отдавать прежнюю страницу: свежую берём по новому адресу
        window.__janamenReload = function () {
          var sep = location.search ? '&' : '?'
          location.replace(location.pathname + location.search + sep + '_r=' + Date.now() + location.hash)
        }
        function started() {
          return !document.getElementById('boot')
        }
        function show(title, detail, state) {
          var boot = document.getElementById('boot')
          if (!boot) return
          boot.className = state || 'stuck'
          document.getElementById('boot-title').textContent = title
          document.getElementById('boot-detail').textContent = detail || ''
        }
        function reloadOnce() {
          try {
            if (sessionStorage.getItem(KEY)) return false
            sessionStorage.setItem(KEY, '1')
          } catch (e) {
            return false
          }
          window.__janamenReload()
          return true
        }
        var lastError = ''
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target
            var asset = el && el !== window && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')
            if (!asset) lastError = event.message || ''
            if (started()) return
            if (asset) {
              var src = el.src || el.href || ''
              if (src.indexOf('/assets/') === -1) return
              if (!reloadOnce()) show(T[1], T[2] + src.split('/').pop())
              return
            }
            show(T[3], T[4] + lastError)
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          if (started()) return
          show(T[3], T[5] + ((reason && reason.message) || reason || ''))
        })
        // Последний рубеж: если приложение упало целиком и React очистил страницу — возвращаем экран
        // с текстом ошибки и кнопкой, а не оставляем пустой фон (вызывается сразу после разметки #root)
        window.__janamenWatchRoot = function () {
          var root = document.getElementById('root')
          var boot = document.getElementById('boot')
          if (boot && LANG !== 'ru') {
            document.getElementById('boot-title').textContent = T[0]
            boot.querySelector('button').textContent = T[9]
          }
          if (!root || !boot || !window.MutationObserver) return
          var template = boot.cloneNode(true)
          new MutationObserver(function () {
            if (root.childElementCount > 0) return
            root.appendChild(template.cloneNode(true))
            show(T[6], T[5] + lastError)
          }).observe(root, { childList: true })
        }
        setTimeout(function () {
          if (!started()) show(T[7], T[8], 'slow')
        }, 15000)
        setTimeout(function () {
          try {
            if (started()) sessionStorage.removeItem(KEY)
          } catch (e) {}
        }, 20000)
      })()
    </script>
    <!-- шрифт подгружается без блокировки: при медленной сети текст сразу виден системным шрифтом -->
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#168F12" /><path d="M22 18h8v20c0 6-4 10-10 10h-2v-7h1c2 0 3-1 3-3V18z" fill="#fff" /><circle cx="42" cy="40" r="7" fill="#fff" /></svg>
        <div class="spin"></div>
        <div>
          <b id="boot-title">Загрузка JanaMen…</b>
          <small id="boot-detail"></small>
        </div>
        <button type="button" onclick="window.__janamenReload()">Обновить страницу</button>
      </div>
    </div>
    <script>
      window.__janamenWatchRoot()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
